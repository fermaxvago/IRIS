name: Repository quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IRIS_RUN_OLLAMA_INTEGRATION: "0"
    steps:
      - name: Check out evaluated revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Identify evaluated revision
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          checkout_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          print(f"event={os.environ['GITHUB_EVENT_NAME']}")
          print(f"checkout_sha={checkout_sha}")
          print(f"github_sha={os.environ['GITHUB_SHA']}")
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              request = event["pull_request"]
              print(f"pr_number={request['number']}")
              print(f"pr_head_sha={request['head']['sha']}")
              print(f"pr_base_sha={request['base']['sha']}")
          else:
              print(f"pushed_sha={event['after']}")
          PY

      - name: Install project and verification tools
        run: python -m pip install -e ".[dev]" build

      - name: Report tool versions
        run: |
          python --version
          python -m pip --version
          python -m pytest --version
          python -m ruff --version
          python -m mypy --version
          python -m build --version

      - name: Tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q

      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: python -m ruff check .

      - name: Ruff format
        if: ${{ !cancelled() }}
        run: python -m ruff format --check .

      - name: Mypy
        if: ${{ !cancelled() }}
        run: python -m mypy iris

      - name: Build wheel and source distribution
        if: ${{ !cancelled() }}
        run: python -m build
