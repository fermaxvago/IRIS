[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-personal-system"
version = "0.1.0"
description = "Local-first intelligent system for personal computing and automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "types-psutil>=5.9,<8",
]

[project.scripts]
iris = "iris.__main__:main"

[tool.setuptools.packages.find]
include = ["iris*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "integration: opt-in tests requiring external local services",
]
testpaths = ["tests"]

[tool.mypy]
files = ["iris"]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
