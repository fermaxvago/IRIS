[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-personal-system"
version = "0.1.0"
description = "Local-first intelligent system for personal computing and automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
iris = "iris.__main__:main"

[tool.setuptools.packages.find]
include = ["iris*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
